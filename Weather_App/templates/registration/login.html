{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/header.css' %}">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

{% include 'header.html' %}

<main class="auth-container">
    <img src="{% static 'image/mayden.png' %}" class="cloud-bg-1" alt="cloud">

    <div class="auth-card">
        <div class="auth-logo">
            <h2>Đăng Nhập</h2>
            <p class="text-white-50 fs-6">Chào mừng bạn quay trở lại</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        <form action="{% url 'Weather_App:login_page' %}" method="POST">
            {% csrf_token %}
            <div class="input-group mb-3">
                <span class="input-group-text"><i class="fa-regular fa-envelope"></i></span>
                <input type="text" name="username" class="form-control" placeholder="Tên đăng nhập" required>
            </div>

            <div class="input-group mb-3">
                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                <input type="password" name="password" class="form-control" placeholder="Mật khẩu" required>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label" for="rememberMe">Ghi nhớ</label>
                </div>
                <a href="{% url 'Weather_App:password_reset' %}" class="forgot-pass">Quên mật khẩu?</a>
            </div>

            <button type="submit" class="btn-submit">ĐĂNG NHẬP</button>
        </form>

        <div class="mt-4 text-center">
            <span class="text-white-50">Chưa có tài khoản? </span>
            <a href="{% url 'Weather_App:register_page' %}" class="text-warning fw-bold text-decoration-none">Đăng ký ngay</a>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
