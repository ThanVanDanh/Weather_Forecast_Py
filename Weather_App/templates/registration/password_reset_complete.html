{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <title>Hoàn Tất Đổi Mật Khẩu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/header.css' %}">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
	<link rel="stylesheet" href="{% static 'css/footer.css' %}">

<body>
{% include 'header.html' %}
<main class="auth-container">
    <div class="auth-card text-center">
        <div class="auth-logo mb-3">
            <h2 class="text-success">Thành công!</h2>
        </div>

        <p class="text-white mb-4">
            Mật khẩu của bạn đã được thay đổi thành công.<br>
            Bây giờ bạn có thể đăng nhập bằng mật khẩu mới.
        </p>

        <a href="{% url 'Weather_App:login_page' %}" class="btn-submit text-decoration-none d-block">
            Đăng nhập ngay
        </a>
    </div>

{% include 'footer.html' %}
