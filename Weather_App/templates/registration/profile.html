{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <title>Hồ Sơ Cá Nhân</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/header.css' %}">
    <link rel="stylesheet" href="{% static 'css/profile.css' %}">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="profile-page">

{% include 'header.html' %}

<div class="container mt-5 mb-5">
    <div class="row">
        <div class="col-md-4">
            <div class="profile-header glass text-center">
                <div class="profile-avatar">
                    <i class="fa-solid fa-user"></i>
                </div>
                <h4>{{ user.username }}</h4>
                <p class="text-white-50">{{ user.email }}</p>
                <hr>
                <div class="list-group glass">
					<a href="{% url 'Weather_App:dashboard' %}" class="list-group-item list-group-item-action">
						<i class="fa-solid fa-arrow-left me-2"></i> Quay lại trang chủ
					</a>
					<a href="{% url 'Weather_App:password_change' %}" class="list-group-item list-group-item-action">
						<i class="fa-solid fa-key me-2"></i> Đổi mật khẩu
					</a>
				</div>
            </div>


        </div>

        <div class="col-md-8">
            <div class="form-section glass">
                <h3 class="mb-4 border-bottom pb-2">Cập nhật thông tin</h3>

                <form method="POST">
                    {% csrf_token %}

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Họ</label>
                            {{ u_form.last_name }}
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Tên</label>
                            {{ u_form.first_name }}
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email (Không thể sửa)</label>
                        {{ u_form.email }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Số điện thoại</label>
                        {{ p_form.phone }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Địa chỉ (Tự động cập nhật khi Định vị)</label>
                        {{ p_form.address }}
                    </div>

                    <div class="text-end mt-4">
                        <button type="submit" class="btn-submit" style="width: auto; padding: 10px 30px;">
                            <i class="fa-solid fa-floppy-disk me-2"></i> Lưu thay đổi
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
