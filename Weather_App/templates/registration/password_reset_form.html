{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <title>Quên Mật Khẩu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/header.css' %}">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
	<link rel="stylesheet" href="{% static 'css/footer.css' %}">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
{% include 'header.html' %}
<main class="auth-container">
    <div class="auth-card">
        <div class="auth-logo">
            <h2>Khôi Phục Mật Khẩu</h2>
            <p class="text-white-50 fs-6">Nhập email bạn đã đăng ký</p>
        </div>
        <form method="POST">
            {% csrf_token %}
            <div class="input-group mb-3">
                <span class="input-group-text">@</span>
                <input type="email" name="email" class="form-control" placeholder="Email của bạn" required>
            </div>
            <button type="submit" class="btn-submit">Gửi Link Reset</button>
            <a href="{% url 'Weather_App:login_page' %}" class="btn btn-link text-white w-100 mt-2">Quay lại Đăng nhập</a>
        </form>
    </div>
</main>
</body>
{% include 'footer.html' %}
</html>
